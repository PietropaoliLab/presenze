<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no">
<title>Registro presenze</title>
<style>
:root{--blu:#1d4e89;--verde:#1e7b4a;--rosso:#b3261e;--grigio:#5f6670;--bordo:#d9dde3;--sfondo:#f4f6f9;--testo:#1c2026}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sfondo);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--testo);font-size:15px;line-height:1.45}
#app{padding:0 16px}
.scheda{max-width:480px;margin:24px auto;background:#fff;border-radius:16px;padding:24px 20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.scheda.larga{max-width:720px}
h2{margin:4px 0 6px;font-size:22px;line-height:1.25;font-weight:650}
h3{margin:0 0 12px;font-size:18px;font-weight:650}
.etichetta{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blu);font-weight:700}
.sotto{color:var(--grigio);margin:0 0 18px}
.campo{margin-bottom:14px}
.campo label{display:block;font-weight:600;margin-bottom:4px;font-size:14px}
.campo input,.campo select{width:100%;font-size:18px;padding:12px;border:1px solid var(--bordo);border-radius:10px;background:#fff;color:var(--testo);-webkit-appearance:none;appearance:none;font-family:inherit}
.campo select{font-size:16px;background-image:linear-gradient(45deg,transparent 50%,#5f6670 50%),linear-gradient(135deg,#5f6670 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.campo input:focus,.campo select:focus{outline:2px solid var(--blu);border-color:transparent}
.nota{font-size:13px;color:var(--grigio);margin:4px 0 16px;line-height:1.45}
.btn-grande{display:block;width:100%;font-size:19px;font-weight:650;padding:15px;border:0;border-radius:12px;background:var(--blu);color:#fff;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none}
.btn-grande:disabled{opacity:.55;cursor:default}
.btn-sec{font-size:15px;padding:9px 14px;border:1px solid var(--bordo);border-radius:10px;background:#fff;color:var(--testo);margin:4px 6px 4px 0;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
.btn-sec.pericolo{color:var(--rosso);border-color:#efc4c0}
.btn-sec:disabled{opacity:.55;cursor:default}
.messaggio{margin-top:14px;font-size:15px}
.messaggio.err{color:var(--rosso);font-weight:600}
.messaggio.ok{color:var(--verde);font-weight:600}
.messaggio.info{color:var(--grigio)}
.esito-ok{text-align:center;padding:10px 0}
.esito-ok .spunta{font-size:64px;line-height:1;color:var(--verde)}
.esito-ok .nome{font-size:22px;font-weight:700;margin-top:8px}
.esito-ok .ora{font-size:18px;color:var(--verde);font-weight:600;margin-top:4px}
.bloccato{text-align:center;background:#fdecea;border:2px solid var(--rosso);border-radius:14px;padding:22px 16px;margin-top:6px}
.bloccato .icona{font-size:56px;line-height:1}
.bloccato .titolo{font-size:22px;font-weight:800;color:var(--rosso);margin-top:8px}
.bloccato .testo{font-size:16px;margin-top:10px}
.bloccato .nota-b{font-size:14px;margin-top:12px;color:var(--rosso);font-weight:600}
.avviso{background:#fff4e5;border:1px solid #f3d19c;color:#7a4b00;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.avviso.grave{background:#fdecea;border-color:#f1b8b2;color:var(--rosso)}
.caricamento{color:var(--grigio);text-align:center;padding:30px 0}
/* configurazione */
ol.passi{padding-left:22px;margin:8px 0 0}
ol.passi li{margin-bottom:14px}
ol.passi b{font-weight:650}
.percorso{background:#eef2f7;border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap}
.riquadro-ok{background:#e9f6ef;border:1px solid #b9e2c9;border-radius:12px;padding:14px;margin-top:14px}
/* pannello docente */
.pannello{max-width:1200px;margin:20px auto}
.barra{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;color:var(--grigio);font-size:14px}
.griglia{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.griglia{grid-template-columns:1fr}}
.riquadro{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
#box_qr{text-align:center}
#box_qr svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
#box_qr .url{font-size:11px;color:var(--grigio);word-break:break-all;margin-top:6px}
#box_qr.intero{position:fixed;inset:0;z-index:9000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh;cursor:pointer}
#box_qr.intero svg{width:auto;height:80vh;max-width:96vw}
#box_qr.intero .titolo-qr{font-size:3.2vh;font-weight:700}
.titolo-qr{font-weight:650;margin:6px 0}
.contatore{font-size:44px;font-weight:750;color:var(--blu);line-height:1}
.codice{font-size:40px;font-weight:800;letter-spacing:.15em;display:none;margin-top:8px}
table.presenze{width:100%;border-collapse:collapse;font-size:14px}
table.presenze th{text-align:left;color:var(--grigio);font-weight:600;border-bottom:1px solid var(--bordo);padding:6px 4px}
table.presenze td{border-bottom:1px solid #eef0f3;padding:6px 4px;vertical-align:top}
.scorrimento{max-height:440px;overflow:auto}
.tentativi{background:#fdecea;border:2px solid var(--rosso);border-radius:12px;padding:10px 12px;margin-bottom:12px;color:var(--rosso)}
.tentativi ul{margin:6px 0 0 18px;padding:0;color:var(--testo);font-size:14px}
.testa{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
hr{border:0;border-top:1px solid #eef0f3;margin:14px 0}
#toasts{position:fixed;top:16px;right:16px;z-index:9500;display:flex;flex-direction:column;gap:10px;width:420px;max-width:calc(100vw - 32px)}
.toast{background:#fdecea;border:2px solid var(--rosso);color:var(--rosso);border-radius:12px;padding:12px 14px;font-size:17px;box-shadow:0 6px 24px rgba(0,0,0,.18);cursor:pointer}
.toast b{display:block;margin-bottom:2px}
/* a schermo intero l'avviso va SOTTO il QR, mai sopra (un QR coperto non si legge) */
body.qr-intero #box_qr svg{height:64vh}
body.qr-intero #toasts{top:auto;bottom:2vh;right:auto;left:50%;transform:translateX(-50%);width:min(760px,92vw)}
body.qr-intero .toast:not(:last-child){display:none}
</style>
</head>
<body>
<div id="app"><div class="scheda"><p class="caricamento">Caricamento…</p></div></div>
<div id="toasts"></div>

<!-- Codice del motore da incollare in Google Apps Script (mostrato nella pagina di configurazione) -->
<script id="codice-motore" type="text/plain">/**
 * ============================================================
 *  REGISTRO PRESENZE — MOTORE (Google Apps Script)
 *
 *  Questo codice vive dentro il foglio Google delle presenze e
 *  gira sui server di Google. Riceve le richieste della pagina
 *  https://pietropaolilab.github.io/presenze/ (docente e studenti),
 *  fa i controlli anti-frode e scrive le righe nel foglio.
 *
 *  Installazione (una volta): dal foglio Google
 *    Estensioni › Apps Script › incolla questo codice › Salva ›
 *    Esegui il deployment › Nuovo deployment › App web ›
 *    Esegui come: Me — Chi ha accesso: Chiunque.
 *
 *  Schede del foglio (create da sole alla prima richiesta):
 *    Impostazioni        materie, password, durata (le modifichi tu)
 *    Presenze            una riga per ogni presenza
 *    Tentativi bloccati  chi ha provato a registrare un altro studente
 *    Lezioni             elenco delle lezioni avviate
 *  Le colonne sono abbinate per NOME: puoi riordinarle o aggiungerne.
 * ============================================================
 * @OnlyCurrentDoc
 */

const VERSIONE = 1;

const FOGLIO = {
  impostazioni: 'Impostazioni',
  presenze: 'Presenze',
  tentativi: 'Tentativi bloccati',
  lezioni: 'Lezioni'
};

const COL_PRESENZE = ['data_ora', 'anno_accademico', 'materia', 'argomento', 'id_lezione',
  'matricola', 'cognome', 'nome', 'controlli', 'id_dispositivo', 'dispositivo'];
const COL_TENTATIVI = ['data_ora', 'materia', 'argomento', 'id_lezione', 'motivo',
  'matricola_tentata', 'cognome_tentato', 'nome_tentato', 'telefono_gia_usato_da',
  'id_dispositivo', 'dispositivo'];
const COL_LEZIONI = ['id', 'anno_accademico', 'materia', 'argomento', 'aperta_il', 'scade_il',
  'chiusa', 'codice', 'scadenza_ms'];

const PASSWORD_INIZIALE = 'cambiami';

const IMPOSTAZIONI_INIZIALI = [
  ['Impostazione', 'Valore', 'Note'],
  ['anno_accademico', '2026/2027', 'Aggiornalo a ogni anno accademico'],
  ['docente', 'Prof. Davide Pietropaoli', ''],
  ['password_docente', PASSWORD_INIZIALE, 'Password del pannello docente'],
  ['durata_minuti', '30', 'Dopo questo tempo il QR smette di funzionare'],
  ['richiedi_codice_orale', 'NO', 'SI = lo studente inserisce anche un codice a 3 cifre detto a voce'],
  ['', '', ''],
  ['materie', '', 'Una materia per riga qui sotto, in colonna A'],
  ['OPD - Clinica Odontostomatologica', '', ''],
  ['OPD - Igiene Dentale', '', ''],
  ['OPD - Protesi', '', ''],
  ['OPD - Odontoiatria di Precisione', '', ''],
  ['CLID - Parodontologia I', '', ''],
  ['CLID - Pratica professionale II', '', '']
];

const SECONDI_CACHE = 6 * 3600;   // durata massima della cache di Google

/* ============================================================
 *  Ingresso delle richieste
 * ============================================================ */

// La pagina manda sempre una POST con un testo JSON: {azione: '...', ...}
function doPost(e) {
  let richiesta = {};
  try {
    richiesta = JSON.parse((e && e.postData && e.postData.contents) || '{}');
  } catch (err) {
    return risposta_({ ok: false, errore: 'Richiesta non valida.' });
  }
  return risposta_(esegui_(richiesta));
}

// Aprendo l'indirizzo del motore nel browser si vede solo una pagina di conferma.
function doGet(e) {
  const p = (e && e.parameter) || {};
  if (p.azione === 'ping') return risposta_(esegui_({ azione: 'ping' }));
  return HtmlService.createHtmlOutput(
    '<div style="font-family:sans-serif;max-width:520px;margin:40px auto;line-height:1.5">' +
    '<h2>Motore del Registro presenze attivo ✔</h2>' +
    '<p>Copia l\'indirizzo di questa pagina (quello che finisce con <b>/exec</b>) e incollalo ' +
    'nella pagina di configurazione del registro.</p></div>')
    .setTitle('Registro presenze — motore');
}

const AZIONI = {
  ping: () => {
    const cfg = impostazioni_();
    return { motore: 'registro-presenze', versione: VERSIONE, foglio: ss_().getName(),
      password_da_impostare: !cfg.password_docente || cfg.password_docente === PASSWORD_INIZIALE,
      materie: cfg.materie.length };
  },
  impostaPassword: r => impostaPrimaPassword_(r.nuova),
  info: r => infoLezione_(r.l),
  registra: r => registra_(r.l, r.d),
  accedi: r => docenteAccedi_(r.pwd),
  avvia: r => docenteAvvia_(r.pwd, r.materia, r.argomento, r.durata),
  stato: r => docenteStato_(r.pwd, r.id),
  chiudi: r => docenteChiudi_(r.pwd, r.id)
};

function esegui_(r) {
  try {
    const f = AZIONI[r && r.azione];
    if (!f) return { ok: false, errore: 'Azione sconosciuta.' };
    return { ok: true, dati: f(r) };
  } catch (err) {
    return { ok: false, errore: err && err.message ? err.message : String(err) };
  }
}

function risposta_(oggetto) {
  return ContentService.createTextOutput(JSON.stringify(oggetto))
    .setMimeType(ContentService.MimeType.JSON);
}

/* ============================================================
 *  Foglio
 * ============================================================ */

function ss_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  if (!ss) throw new Error('Il motore va creato dal foglio Google: Estensioni › Apps Script.');
  return ss;
}

function foglio_(nome, colonne) {
  const ss = ss_();
  let sh = ss.getSheetByName(nome);
  if (!sh) sh = ss.insertSheet(nome);
  if (colonne && sh.getLastRow() === 0) {
    sh.getRange(1, 1, 1, colonne.length).setValues([colonne]).setFontWeight('bold');
    sh.setFrozenRows(1);
  }
  return sh;
}

function preparaImpostazioni_() {
  const ss = ss_();
  let sh = ss.getSheetByName(FOGLIO.impostazioni);
  if (sh) return sh;
  sh = ss.insertSheet(FOGLIO.impostazioni, 0);
  sh.getRange('A:C').setNumberFormat('@');   // "2026/2027" resta testo, non diventa una data
  sh.getRange(1, 1, IMPOSTAZIONI_INIZIALI.length, 3).setValues(IMPOSTAZIONI_INIZIALI);
  sh.getRange('A1:C1').setFontWeight('bold');
  sh.getRange('A8').setFontWeight('bold');
  sh.setFrozenRows(1);
  sh.setColumnWidth(1, 340); sh.setColumnWidth(2, 200); sh.setColumnWidth(3, 420);
  return sh;
}

// Aggiunge una riga mettendo ogni valore sotto la colonna con lo stesso nome
function aggiungiRiga_(nome, colonne, record) {
  const sh = foglio_(nome, colonne);
  const intest = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String);
  const mancanti = colonne.filter(c => intest.indexOf(c) < 0);
  if (mancanti.length) {   // colonna nuova: la aggiungo in fondo
    sh.getRange(1, intest.length + 1, 1, mancanti.length).setValues([mancanti]).setFontWeight('bold');
    mancanti.forEach(c => intest.push(c));
  }
  const riga = intest.map(h => (record[h] === undefined || record[h] === null) ? '' : record[h]);
  sh.getRange(sh.getLastRow() + 1, 1, 1, riga.length).setNumberFormat('@').setValues([riga]);
}

function leggiRighe_(nome) {
  const sh = ss_().getSheetByName(nome);
  if (!sh || sh.getLastRow() < 2) return [];
  const v = sh.getDataRange().getValues();
  const h = v[0].map(String);
  return v.slice(1).map(r => {
    const o = {};
    h.forEach((k, i) => { o[k] = r[i]; });
    return o;
  });
}

/* ============================================================
 *  Utilità
 * ============================================================ */

function fuso_() {
  return ss_().getSpreadsheetTimeZone() || Session.getScriptTimeZone() || 'Europe/Rome';
}

function ora_(d, formato) {
  return Utilities.formatDate(d || new Date(), fuso_(), formato || 'yyyy-MM-dd HH:mm:ss');
}

function siNo_(v) {
  return v === true || /^(s[iì]|yes|true|vero|1|x)$/i.test(String(v).trim());
}

// Toglie caratteri di controllo e quelli che il foglio leggerebbe come formula
function pulisci_(x, max) {
  let s = String(x === undefined || x === null ? '' : x).replace(/[\u0000-\u001f<>]/g, '').trim();
  s = s.replace(/^[=+@\-]+/, '');
  return s.substring(0, max || 60);
}

function descriviDispositivo_(ua) {
  ua = String(ua || '');
  const so = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' :
    /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : 'Altro';
  const br = /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /EdgA?\/|EdgiOS/.test(ua) ? 'Edge' :
    /Firefox|FxiOS/.test(ua) ? 'Firefox' : /CriOS|Chrome/.test(ua) ? 'Chrome' :
    /Safari/.test(ua) ? 'Safari' : 'Altro';
  return so + ' ' + br;
}

function nuovoId_() {
  return Utilities.getUuid().replace(/-/g, '').substring(0, 24);
}

function conBlocco_(funzione) {
  const lock = LockService.getScriptLock();
  if (!lock.tryLock(20000)) return { occupato: true };
  try { return funzione(); } finally { lock.releaseLock(); }
}

/* ============================================================
 *  Impostazioni
 * ============================================================ */

function impostazioni_() {
  const cache = CacheService.getScriptCache();
  const c = cache.get('CFG');
  if (c) return JSON.parse(c);
  const cfg = { anno_accademico: '', docente: '', password_docente: '', durata_minuti: 30,
    richiedi_codice_orale: false, materie: [] };
  const v = preparaImpostazioni_().getDataRange().getValues();
  let inMaterie = false;
  v.slice(1).forEach(r => {
    const k = String(r[0]).trim();
    if (!k) return;
    if (k.toLowerCase() === 'materie') { inMaterie = true; return; }
    if (inMaterie) { cfg.materie.push(k); return; }
    let val = r[1];
    if (val instanceof Date) val = ora_(val, 'yyyy');
    cfg[k.toLowerCase()] = val;
  });
  cfg.durata_minuti = Number(cfg.durata_minuti) || 30;
  cfg.richiedi_codice_orale = siNo_(cfg.richiedi_codice_orale);
  cfg.password_docente = String(cfg.password_docente === undefined ? '' : cfg.password_docente);
  cfg.anno_accademico = String(cfg.anno_accademico || '');
  cfg.docente = String(cfg.docente || '');
  cache.put('CFG', JSON.stringify(cfg), 20);   // le modifiche al foglio valgono entro 20 secondi
  return cfg;
}

function controllaPassword_(pwd) {
  const cfg = impostazioni_();
  if (!cfg.password_docente || cfg.password_docente === PASSWORD_INIZIALE)
    throw new Error('Password non ancora impostata: apri la pagina di configurazione del registro.');
  if (String(pwd || '') !== cfg.password_docente) {
    Utilities.sleep(1000);
    throw new Error('Password errata.');
  }
  return cfg;
}

// La password si può impostare da qui SOLO la prima volta (finché vale "cambiami").
// Dopo si cambia solo nella scheda Impostazioni del foglio.
function impostaPrimaPassword_(nuova) {
  nuova = String(nuova || '');
  if (nuova.length < 6) throw new Error('La password deve avere almeno 6 caratteri.');
  return conBlocco_(() => {
    CacheService.getScriptCache().remove('CFG');
    const cfg = impostazioni_();
    if (cfg.password_docente && cfg.password_docente !== PASSWORD_INIZIALE)
      throw new Error('La password è già impostata: per cambiarla usa la scheda Impostazioni del foglio.');
    const sh = preparaImpostazioni_();
    const v = sh.getDataRange().getValues();
    for (let i = 0; i < v.length; i++) {
      if (String(v[i][0]).trim().toLowerCase() === 'password_docente') {
        sh.getRange(i + 1, 2).setNumberFormat('@').setValue(nuova);
        CacheService.getScriptCache().remove('CFG');
        return { impostata: true };
      }
    }
    throw new Error('Nella scheda Impostazioni manca la riga password_docente.');
  });
}

/* ============================================================
 *  Lezioni
 * ============================================================ */

function lezione_(id) {
  id = String(id || '');
  if (!/^[a-f0-9]{24}$/.test(id)) return null;
  const cache = CacheService.getScriptCache();
  const c = cache.get('L_' + id);
  if (c) return JSON.parse(c);
  const r = leggiRighe_(FOGLIO.lezioni).filter(x => String(x.id) === id)[0];
  if (!r) return null;
  const lez = {
    id: id, anno_accademico: String(r.anno_accademico), materia: String(r.materia),
    argomento: String(r.argomento || ''), aperta_il: String(r.aperta_il), scade_il: String(r.scade_il),
    chiusa: siNo_(r.chiusa), codice: String(r.codice || ''), scadenza_ms: Number(r.scadenza_ms)
  };
  cache.put('L_' + id, JSON.stringify(lez), SECONDI_CACHE);
  return lez;
}

function lezioneAperta_(lez) {
  return !!lez && !lez.chiusa && Date.now() < lez.scadenza_ms;
}

// Presenze e tentativi di una lezione, tenuti in cache per essere veloci;
// se la cache sparisce si ricostruiscono dal foglio, che resta l'archivio vero.
function statoLezione_(id) {
  const cache = CacheService.getScriptCache();
  const c = cache.get('S_' + id);
  if (c) return JSON.parse(c);
  const presenze = leggiRighe_(FOGLIO.presenze).filter(r => String(r.id_lezione) === id)
    .map(r => ({ ora: String(r.data_ora), matricola: String(r.matricola), cognome: String(r.cognome),
      nome: String(r.nome), disp: String(r.id_dispositivo), telefono: String(r.dispositivo) }));
  const tentativi = leggiRighe_(FOGLIO.tentativi).filter(r => String(r.id_lezione) === id)
    .map(r => ({ ora: String(r.data_ora), motivo: String(r.motivo), matricola: String(r.matricola_tentata),
      cognome: String(r.cognome_tentato), nome: String(r.nome_tentato),
      gia_usato_da: String(r.telefono_gia_usato_da), telefono: String(r.dispositivo) }));
  const stato = { presenze: presenze, tentativi: tentativi };
  salvaStato_(id, stato);
  return stato;
}

function salvaStato_(id, stato) {
  CacheService.getScriptCache().put('S_' + id, JSON.stringify(stato), SECONDI_CACHE);
}

/* ============================================================
 *  Studente
 * ============================================================ */

function infoLezione_(token) {
  const lez = lezione_(pulisci_(token, 40));
  if (!lez) return { stato: 'non_valido' };
  if (!lezioneAperta_(lez)) return { stato: 'chiusa', materia: lez.materia };
  return { stato: 'aperta', materia: lez.materia, argomento: lez.argomento,
    data: lez.aperta_il.substring(8, 10) + '/' + lez.aperta_il.substring(5, 7) + '/' + lez.aperta_il.substring(0, 4),
    codice: !!lez.codice };
}

/* Il "codice del telefono" è un identificativo casuale creato dalla pagina alla prima
   visita e salvato in tre posti del browser. I blocchi valgono solo dentro la stessa
   lezione: alla lezione successiva non resta nessun blocco. */
function registra_(token, d) {
  d = d || {};
  token = pulisci_(token, 40);
  const matricola = pulisci_(d.matricola, 20).replace(/\s/g, '');
  const cognome = pulisci_(d.cognome);
  const nome = pulisci_(d.nome);
  const disp = pulisci_(d.dispositivo, 64);
  const telefono = descriviDispositivo_(d.ua);

  if (!/^[0-9]{3,15}$/.test(matricola)) return { esito: 'errore', testo: 'La matricola deve contenere solo numeri.' };
  if (!cognome || !nome) return { esito: 'errore', testo: 'Inserisci cognome e nome.' };
  if (!/^[A-Za-z0-9-]{8,64}$/.test(disp))
    return { esito: 'errore', testo: 'Il browser non ha fornito il codice del telefono. Esci dalla navigazione privata e riprova.' };

  const r = conBlocco_(() => {
    const lez = lezione_(token);
    if (!lez) return { esito: 'errore', testo: 'QR code non valido. Inquadra di nuovo quello proiettato in aula.' };
    if (!lezioneAperta_(lez)) return { esito: 'errore', testo: 'Le registrazioni per questa lezione sono chiuse.' };
    if (lez.codice && String(d.codice || '').replace(/\D/g, '') !== lez.codice)
      return { esito: 'errore', testo: 'Codice della lezione errato: inserisci quello detto dal docente.' };

    const stato = statoLezione_(token);
    const chi = p => p.nome + ' ' + p.cognome + ' (' + p.matricola + ')';
    const tentativo = (motivo, giaUsatoDa) => {
      const t = { data_ora: ora_(), materia: lez.materia, argomento: lez.argomento, id_lezione: token,
        motivo: motivo, matricola_tentata: matricola, cognome_tentato: cognome, nome_tentato: nome,
        telefono_gia_usato_da: giaUsatoDa, id_dispositivo: disp, dispositivo: telefono };
      aggiungiRiga_(FOGLIO.tentativi, COL_TENTATIVI, t);
      stato.tentativi.push({ ora: t.data_ora, motivo: motivo, matricola: matricola, cognome: cognome,
        nome: nome, gia_usato_da: giaUsatoDa, telefono: telefono });
      salvaStato_(token, stato);
    };

    // 1. Telefono già usato in questa lezione
    const stessoTel = stato.presenze.filter(p => p.disp === disp);
    if (stessoTel.length) {
      if (stessoTel.some(p => p.matricola === matricola))
        return { esito: 'ok', nome: nome + ' ' + cognome, materia: lez.materia, testo: 'La tua presenza era già registrata.' };
      const primo = stessoTel[0];
      tentativo('telefono già usato per un altro studente', chi(primo));
      return { esito: 'bloccato', titolo: 'Tentativo bloccato',
        testo: 'Da questo telefono è già stata registrata la presenza di ' + primo.nome + ' ' + primo.cognome +
          ' per questa lezione. Non si possono registrare altri studenti dallo stesso telefono.',
        nota: 'Il tentativo è stato segnalato al docente.' };
    }
    // 2. Matricola già registrata da un altro telefono
    const stessaMat = stato.presenze.filter(p => p.matricola === matricola);
    if (stessaMat.length) {
      tentativo('matricola già registrata da un altro telefono', chi(stessaMat[0]));
      return { esito: 'bloccato', titolo: 'Presenza già registrata',
        testo: 'Questa matricola risulta già registrata per questa lezione da un altro telefono.',
        nota: 'La segnalazione è stata inviata al docente: se sei tu, parlane con lui a fine lezione.' };
    }
    // 3. Tutto in ordine
    const adesso = new Date();
    const riga = { data_ora: ora_(adesso), anno_accademico: lez.anno_accademico, materia: lez.materia,
      argomento: lez.argomento, id_lezione: token, matricola: matricola, cognome: cognome, nome: nome,
      controlli: 'OK', id_dispositivo: disp, dispositivo: telefono };
    aggiungiRiga_(FOGLIO.presenze, COL_PRESENZE, riga);
    stato.presenze.push({ ora: riga.data_ora, matricola: matricola, cognome: cognome, nome: nome,
      disp: disp, telefono: telefono });
    salvaStato_(token, stato);
    return { esito: 'ok', nome: nome + ' ' + cognome, materia: lez.materia,
      testo: 'Presenza registrata alle ' + ora_(adesso, 'HH:mm') };
  });
  return r.occupato ? { esito: 'occupato' } : r;
}

/* ============================================================
 *  Docente
 * ============================================================ */

function lezioniAperte_() {
  return leggiRighe_(FOGLIO.lezioni)
    .filter(r => !siNo_(r.chiusa) && Date.now() < Number(r.scadenza_ms))
    .map(r => ({ id: String(r.id), materia: String(r.materia), argomento: String(r.argomento || ''),
      aperta_il: String(r.aperta_il) }));
}

function docenteAccedi_(pwd) {
  const cfg = controllaPassword_(pwd);
  return { docente: cfg.docente, materie: cfg.materie, durata: cfg.durata_minuti, aperte: lezioniAperte_() };
}

function docenteAvvia_(pwd, materia, argomento, durata) {
  const cfg = controllaPassword_(pwd);
  if (cfg.materie.indexOf(materia) < 0) throw new Error('Materia non presente nella scheda Impostazioni.');
  durata = Math.max(5, Math.min(600, Number(durata) || cfg.durata_minuti));
  const adesso = new Date();
  const scade = new Date(adesso.getTime() + durata * 60000);
  const lez = { id: nuovoId_(), anno_accademico: cfg.anno_accademico, materia: materia,
    argomento: pulisci_(argomento, 100), aperta_il: ora_(adesso), scade_il: ora_(scade), chiusa: 'NO',
    codice: cfg.richiedi_codice_orale ? ('00' + Math.floor(Math.random() * 1000)).slice(-3) : '',
    scadenza_ms: String(scade.getTime()) };
  const r = conBlocco_(() => { aggiungiRiga_(FOGLIO.lezioni, COL_LEZIONI, lez); return {}; });
  if (r.occupato) throw new Error('Il foglio è occupato: riprova tra qualche secondo.');
  CacheService.getScriptCache().remove('L_' + lez.id);
  return docenteStato_(pwd, lez.id);
}

function docenteStato_(pwd, id) {
  controllaPassword_(pwd);
  const lez = lezione_(id);
  if (!lez) throw new Error('Lezione non trovata.');
  const stato = statoLezione_(lez.id);
  return {
    lezione: { id: lez.id, materia: lez.materia, argomento: lez.argomento, scade_il: lez.scade_il,
      codice: lez.codice, aperta: lezioneAperta_(lez) },
    presenze: stato.presenze.map(p => ({ ora: p.ora, matricola: p.matricola, cognome: p.cognome,
      nome: p.nome, telefono: p.telefono })),
    tentativi: stato.tentativi
  };
}

function docenteChiudi_(pwd, id) {
  controllaPassword_(pwd);
  const r = conBlocco_(() => {
    const sh = foglio_(FOGLIO.lezioni, COL_LEZIONI);
    const v = sh.getDataRange().getValues();
    const colId = v[0].map(String).indexOf('id');
    const colChiusa = v[0].map(String).indexOf('chiusa');
    for (let i = 1; i < v.length; i++) {
      if (String(v[i][colId]) === String(id)) sh.getRange(i + 1, colChiusa + 1).setValue('SI');
    }
    return {};
  });
  if (r.occupato) throw new Error('Il foglio è occupato: riprova tra qualche secondo.');
  CacheService.getScriptCache().remove('L_' + id);
  return { chiusa: true };
}
</script>

<script>
/* ============================================================
   REGISTRO PRESENZE — pagina unica (docente, studente, configurazione)

   Indirizzi:
     ?docente&m=MOTORE        pannello del docente
     ?l=LEZIONE&m=MOTORE      pagina dello studente (aperta dal QR)
     (senza parametri)        configurazione
   MOTORE = identificativo dell'app web Google Apps Script del docente.
   ============================================================ */
'use strict';

var PARAMETRI = new URLSearchParams(location.search);
var MOTORE = PARAMETRI.get('m') || '';
var BASE_PAGINA = location.origin + location.pathname;

/* ---------------- Utilità ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mostra(html){ $('app').innerHTML = html; }
function leggiLocale(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function scriviLocale(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

/* Indirizzo del motore a partire dal parametro m */
function urlMotore(m){
  if(!m) return '';
  if(/^https?:\/\//.test(m)) return m;                 // indirizzo completo (es. prove in locale)
  var parti = m.split('/');                            // "dominio/ID" per account Google Workspace
  if(parti.length === 2) return 'https://script.google.com/a/macros/' + parti[0] + '/s/' + parti[1] + '/exec';
  return 'https://script.google.com/macros/s/' + m + '/exec';
}

/* Dall'indirizzo incollato dal docente ricava il parametro m */
function ricavaMotore(testo){
  testo = String(testo || '').trim();
  var g = testo.match(/^https:\/\/script\.google\.com\/(?:a\/macros\/([^\/]+)|macros)\/s\/([A-Za-z0-9_-]{20,})\/(exec|dev)\b/);
  if(g){
    if(g[3] === 'dev') return { errore: 'Questo è l\'indirizzo di prova (finisce con /dev). Serve quello del deployment, che finisce con /exec.' };
    return { m: g[1] ? g[1] + '/' + g[2] : g[2] };
  }
  if(/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/\S*exec$/.test(testo)) return { m: testo };   // prove in locale
  return { errore: 'Non sembra l\'indirizzo di un\'app web Google: deve iniziare con https://script.google.com/ e finire con /exec.' };
}

function linkDocente(m){ return BASE_PAGINA + '?docente&m=' + encodeURIComponent(m); }
function linkStudente(m, idLezione){ return BASE_PAGINA + '?l=' + idLezione + '&m=' + encodeURIComponent(m); }

/* Chiamata al motore: POST con testo JSON (nessun "preflight" CORS) */
function chiama(azione, dati, m){
  var url = urlMotore(m || MOTORE);
  var corpo = JSON.stringify(Object.assign({ azione: azione }, dati || {}));
  return fetch(url, { method: 'POST', body: corpo, redirect: 'follow' })
    .catch(function(){
      throw new Error('Impossibile contattare il motore Google. Controlla la connessione; se succede sempre, ' +
        'verifica che il deployment sia "Chi ha accesso: Chiunque".');
    })
    .then(function(r){
      if(!r.ok) throw new Error('Il motore ha risposto con un errore (' + r.status + ').');
      return r.text();
    })
    .then(function(t){
      var j;
      try{ j = JSON.parse(t); }catch(e){ throw new Error('Risposta non valida dal motore: controlla il deployment ("Chiunque").'); }
      if(!j.ok) throw new Error(j.errore || 'Errore del motore.');
      return j.dati;
    });
}
function testoErrore(e){ return (e && e.message) ? e.message : String(e); }

/* ============================================================
   Codice del telefono: creato alla prima visita e salvato in tre posti
   del browser (localStorage, cookie, IndexedDB). Se uno viene cancellato,
   si recupera dagli altri. Serve solo dentro la stessa lezione.
   ============================================================ */
var ID_KEY = 'presenze_id', ID_OK = /^[A-Za-z0-9-]{8,64}$/, ID_DISP = null;
function nuovoId(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
    ('d' + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
}
function leggiCookie(){ var c = document.cookie.match(/(?:^|; )presenze_id=([A-Za-z0-9-]+)/); return c ? c[1] : null; }
function idbApri(cb){
  try{ var r = indexedDB.open('presenze', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
    r.onsuccess = function(){ cb(r.result); }; r.onerror = function(){ cb(null); };
  }catch(e){ cb(null); }
}
function idbLeggi(cb){
  idbApri(function(db){ if(!db) return cb(null);
    try{ var q = db.transaction('kv').objectStore('kv').get(ID_KEY);
      q.onsuccess = function(){ cb(q.result || null); }; q.onerror = function(){ cb(null); };
    }catch(e){ cb(null); } });
}
function salvaId(id){
  scriviLocale(ID_KEY, id);
  try{ document.cookie = 'presenze_id=' + id + '; max-age=31536000; path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : ''); }catch(e){}
  idbApri(function(db){ if(!db) return; try{ db.transaction('kv', 'readwrite').objectStore('kv').put(id, ID_KEY); }catch(e){} });
}
function preparaId(cb){
  if(ID_DISP){ cb(ID_DISP); return; }
  var id = leggiLocale(ID_KEY);
  if(!ID_OK.test(id || '')) id = leggiCookie();
  if(ID_OK.test(id || '')){ ID_DISP = id; salvaId(id); cb(id); return; }
  idbLeggi(function(v){ ID_DISP = ID_OK.test(v || '') ? v : nuovoId(); salvaId(ID_DISP); cb(ID_DISP); });
}

/* ============================================================
   Pagina di configurazione (indirizzo senza parametri)
   ============================================================ */
function paginaConfigurazione(){
  var salvato = leggiLocale('presenze_motore');
  mostra(
    (salvato ? '<div class="scheda larga"><div class="etichetta">Docente</div><h2>Registro già collegato su questo computer</h2>' +
      '<a class="btn-grande" href="' + esc(linkDocente(salvato)) + '">Apri il pannello docente</a>' +
      '<p class="nota" style="margin-top:10px">Aggiungi il pannello ai preferiti per aprirlo con un clic anche dagli altri computer.</p></div>' : '') +
    '<div class="scheda larga"><div class="etichetta">Studenti</div><h2>Inquadra il QR code</h2>' +
      '<p class="sotto" style="margin:0">Per registrare la presenza inquadra con la fotocamera il QR code proiettato in aula.</p></div>' +
    '<div class="scheda larga"><div class="etichetta">Docente · da fare una volta</div><h2>Collega il registro al tuo foglio Google</h2>' +
      '<p class="sotto">Il "motore" è un piccolo programma che vive dentro il tuo foglio Google: riceve le presenze dai telefoni, ' +
      'fa i controlli anti-frode e scrive le righe nel foglio. Si installa una volta sola; poi da qualunque computer basta il preferito.</p>' +
      '<ol class="passi">' +
        '<li>Apri il <b>foglio Google delle presenze</b> e dal menu scegli <span class="percorso">Estensioni › Apps Script</span>. Si apre l\'editor in una nuova scheda.</li>' +
        '<li>Nell\'editor seleziona tutto il testo che c\'è e cancellalo. Poi premi questo pulsante e <b>incolla</b> (⌘V o Ctrl+V):<br>' +
          '<button type="button" class="btn-sec" id="copia_codice" style="margin-top:8px">Copia il codice del motore</button> ' +
          '<span id="copiato" class="nota"></span><br>Premi l\'icona del <b>dischetto</b> per salvare.</li>' +
        '<li>In alto a destra: <span class="percorso">Esegui il deployment › Nuovo deployment</span>. Clicca l\'<b>ingranaggio</b> accanto a "Seleziona tipo" e scegli <b>App web</b>. Imposta:' +
          '<br>· Esegui come: <b>Me</b><br>· Chi ha accesso: <b>Chiunque</b> (non "Chiunque abbia un Account Google")<br>e premi <b>Esegui il deployment</b>.</li>' +
        '<li>Google chiede l\'autorizzazione: <span class="percorso">Autorizza accesso</span> › scegli il tuo account. Se compare "Google non ha verificato questa app": ' +
          '<span class="percorso">Avanzate › Vai a … (non sicuro)</span>; se compaiono delle caselle, <b>spuntale tutte</b>; poi <b>Consenti</b>. È normale: l\'app è tua e accede solo a questo foglio.</li>' +
        '<li>Copia l\'<b>URL dell\'app web</b> (finisce con <b>/exec</b>) e incollalo qui:' +
          '<div class="campo" style="margin-top:8px"><input id="url_motore" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></div>' +
          '<button type="button" class="btn-grande" id="collega">Collega</button>' +
          '<div id="esito_collega"></div></li>' +
      '</ol></div>');

  $('copia_codice').onclick = function(){
    var codice = $('codice-motore').textContent;
    var fatto = function(){ $('copiato').textContent = '✔ Copiato: ora incollalo nell\'editor di Apps Script.'; };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(codice).then(fatto, function(){ copiaManuale(codice); });
    } else { copiaManuale(codice); }
  };
  $('collega').onclick = collegaMotore;
  $('url_motore').onkeydown = function(e){ if(e.key === 'Enter') collegaMotore(); };
}

function copiaManuale(testo){
  var t = document.createElement('textarea');
  t.value = testo; t.style.width = '100%'; t.style.height = '160px';
  $('copiato').innerHTML = '';
  $('copiato').parentNode.insertBefore(t, $('copiato'));
  t.focus(); t.select();
  try{ document.execCommand('copy'); $('copiato').textContent = '✔ Copiato.'; }
  catch(e){ $('copiato').textContent = 'Seleziona il testo qui sopra e copialo.'; }
}

function collegaMotore(){
  var r = ricavaMotore($('url_motore').value);
  var esito = $('esito_collega');
  if(r.errore){ esito.innerHTML = '<div class="messaggio err">' + esc(r.errore) + '</div>'; return; }
  var b = $('collega'); b.disabled = true; b.textContent = 'Verifico il collegamento…';
  esito.innerHTML = '';
  chiama('ping', {}, r.m).then(function(info){
    b.disabled = false; b.textContent = 'Collega';
    if(info.motore !== 'registro-presenze') throw new Error('A quell\'indirizzo non risponde il motore del registro.');
    scriviLocale('presenze_motore', r.m);
    esito.innerHTML = '<div class="riquadro-ok"><div class="messaggio ok" style="margin:0 0 8px">✔ Collegato al foglio «' + esc(info.foglio) + '»</div>' +
      (info.password_da_impostare ?
        '<div class="campo"><label for="nuova_pwd">Scegli la password del pannello docente (almeno 6 caratteri)</label>' +
        '<input id="nuova_pwd" type="password" autocomplete="new-password"></div>' +
        '<button type="button" class="btn-grande" id="salva_pwd">Salva la password</button><div id="esito_pwd"></div>'
        : finePassoLink(r.m)) + '</div>';
    if(info.password_da_impostare){
      $('salva_pwd').onclick = function(){
        var p = $('nuova_pwd').value;
        if(p.length < 6){ $('esito_pwd').innerHTML = '<div class="messaggio err">Almeno 6 caratteri.</div>'; return; }
        $('salva_pwd').disabled = true;
        chiama('impostaPassword', { nuova: p }, r.m).then(function(){
          try{ sessionStorage.setItem('presenze_pwd', p); }catch(e){}
          $('esito_pwd').innerHTML = '<div class="messaggio ok">✔ Password salvata.</div>' + finePassoLink(r.m);
        }).catch(function(e){
          $('salva_pwd').disabled = false;
          $('esito_pwd').innerHTML = '<div class="messaggio err">' + esc(testoErrore(e)) + '</div>';
        });
      };
    }
  }).catch(function(e){
    b.disabled = false; b.textContent = 'Collega';
    esito.innerHTML = '<div class="messaggio err">' + esc(testoErrore(e)) + '</div>';
  });
}

function finePassoLink(m){
  return '<p style="margin:12px 0 8px">Fatto! Questo è il tuo pannello docente:</p>' +
    '<a class="btn-grande" href="' + esc(linkDocente(m)) + '">Apri il pannello docente</a>' +
    '<p class="nota" style="margin-top:10px">Una volta aperto, salvalo nei preferiti con <b>⌘D</b> (Mac) o <b>Ctrl+D</b> (Windows). ' +
    'Se in Chrome sei collegato con il tuo account Google, il preferito compare da solo anche sugli altri computer. ' +
    'Le materie e le altre impostazioni sono nella scheda <b>Impostazioni</b> del foglio.</p>';
}

/* ============================================================
   Pagina dello studente
   ============================================================ */
function paginaStudente(token){
  preparaId(function(){});
  if(!MOTORE || !/^[a-f0-9]{24}$/.test(token)){ mostraQrNonValido(); return; }
  chiama('info', { l: token }).then(function(info){
    if(info.stato === 'non_valido'){ mostraQrNonValido(); return; }
    if(info.stato === 'chiusa'){
      mostra('<div class="scheda"><div class="etichetta">Registro presenze</div><h2>Registrazioni chiuse</h2>' +
        '<p class="sotto">' + esc(info.materia) + '</p><p>Il docente ha chiuso le presenze per questa lezione.</p></div>');
      return;
    }
    var salvati = {}; try{ salvati = JSON.parse(leggiLocale('presenze_dati') || '{}') || {}; }catch(e){}
    mostra('<div class="scheda"><div class="etichetta">Registro presenze</div>' +
      '<h2>' + esc(info.materia) + '</h2>' +
      '<p class="sotto">' + esc(info.data) + (info.argomento ? ' · ' + esc(info.argomento) : '') + '</p>' +
      '<div id="modulo">' +
        '<div class="campo"><label for="f_matricola">Matricola</label><input id="f_matricola" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" value="' + esc(salvati.matricola) + '"></div>' +
        '<div class="campo"><label for="f_cognome">Cognome</label><input id="f_cognome" type="text" autocomplete="family-name" value="' + esc(salvati.cognome) + '"></div>' +
        '<div class="campo"><label for="f_nome">Nome</label><input id="f_nome" type="text" autocomplete="given-name" value="' + esc(salvati.nome) + '"></div>' +
        (info.codice ? '<div class="campo"><label for="f_codice">Codice detto dal docente</label><input id="f_codice" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"></div>' : '') +
        '<p class="nota">Il telefono viene riconosciuto da un codice salvato nel browser. Da ogni telefono si può registrare una sola presenza per lezione.</p>' +
        '<button id="btn_invia" type="button" class="btn-grande">Registra presenza</button>' +
      '</div><div id="messaggio" class="messaggio"></div><div id="esito"></div></div>');
    var mat = $('f_matricola');
    mat.oninput = function(){ var v = mat.value.replace(/[^0-9]/g, ''); if(v !== mat.value) mat.value = v; };
    mat.oninput();
    $('btn_invia').onclick = function(){ inviaPresenza(token, 0); };
  }).catch(function(e){
    mostra('<div class="scheda"><div class="etichetta">Registro presenze</div><h2>Connessione non riuscita</h2>' +
      '<p class="sotto">' + esc(testoErrore(e)) + '</p><button type="button" class="btn-grande" onclick="location.reload()">Riprova</button></div>');
  });
}

function mostraQrNonValido(){
  mostra('<div class="scheda"><div class="etichetta">Registro presenze</div><h2>QR code non valido</h2>' +
    '<p class="sotto">Inquadra di nuovo il QR code proiettato in aula.</p></div>');
}

function messaggio(t, c){ var m = $('messaggio'); m.className = 'messaggio ' + (c || 'info'); m.textContent = t; }
function valore(id){ var e = $(id); return e ? e.value.trim() : ''; }
function ripristinaInvio(){ var b = $('btn_invia'); b.disabled = false; b.textContent = 'Registra presenza'; }

function inviaPresenza(token, tentativo){
  var btn = $('btn_invia');
  var d = { matricola: valore('f_matricola'), cognome: valore('f_cognome'), nome: valore('f_nome'), codice: valore('f_codice') };
  if(!d.matricola || !d.cognome || !d.nome){ messaggio('Compila matricola, cognome e nome.', 'err'); return; }
  if(!/^[0-9]+$/.test(d.matricola)){ messaggio('La matricola deve contenere solo numeri.', 'err'); return; }
  if($('f_codice') && !d.codice){ messaggio('Inserisci il codice detto dal docente.', 'err'); return; }
  scriviLocale('presenze_dati', JSON.stringify({ matricola: d.matricola, cognome: d.cognome, nome: d.nome }));
  btn.disabled = true; btn.textContent = 'Invio…';
  if(tentativo === 0) messaggio('', 'info');
  preparaId(function(id){
    d.dispositivo = id; d.ua = navigator.userAgent;
    chiama('registra', { l: token, d: d }).then(function(x){
      if(x.esito === 'occupato' && tentativo < 8){
        messaggio('Molti studenti si stanno registrando insieme: riprovo…', 'info');
        setTimeout(function(){ inviaPresenza(token, tentativo + 1); }, 800 + Math.random() * 1700);
        return;
      }
      mostraEsito(x);
    }).catch(function(e){
      ripristinaInvio();
      messaggio('Invio non riuscito: riprova. (' + testoErrore(e) + ')', 'err');
    });
  });
}

function mostraEsito(x){
  var e = $('esito');
  if(x.esito === 'ok'){
    $('modulo').style.display = 'none'; messaggio('', 'info');
    e.className = 'esito-ok';
    e.innerHTML = '<div class="spunta">&#10004;</div><div class="nome">' + esc(x.nome) + '</div>' +
      '<div class="ora">' + esc(x.testo) + '</div><div class="sotto" style="margin-top:10px">' + esc(x.materia) + '</div>';
  } else if(x.esito === 'bloccato'){
    $('modulo').style.display = 'none'; messaggio('', 'info');
    e.className = 'bloccato';
    e.innerHTML = '<div class="icona">&#9940;</div><div class="titolo">' + esc(x.titolo) + '</div>' +
      '<div class="testo">' + esc(x.testo) + '</div><div class="nota-b">' + esc(x.nota) + '</div>';
    if(navigator.vibrate) navigator.vibrate([300, 150, 300]);
  } else {
    ripristinaInvio();
    messaggio(x.testo || 'Registrazione non riuscita: riprova.', 'err');
  }
}

/* ============================================================
   Pannello del docente
   ============================================================ */
var DOC = { pwd: null, info: null, lezione: null, timer: null, inCorso: false, nTentativi: -1, ultimo: null };

function paginaDocente(){
  document.title = 'Registro presenze — Docente';
  if(!MOTORE){ location.replace(BASE_PAGINA); return; }
  scriviLocale('presenze_motore', MOTORE);
  var salvata = null; try{ salvata = sessionStorage.getItem('presenze_pwd'); }catch(e){}
  if(salvata) accedi(salvata, true); else mostraLogin();
}

function mostraLogin(msg){
  mostra('<div class="scheda"><div class="etichetta">Area docente</div><h2>Accesso</h2>' +
    '<div class="campo"><label for="pwd">Password</label><input id="pwd" type="password" autocomplete="current-password"></div>' +
    '<button id="entra" type="button" class="btn-grande">Entra</button>' +
    (msg ? '<div class="messaggio err">' + esc(msg) + '</div>' : '') + '</div>');
  $('entra').onclick = function(){ accedi($('pwd').value, false); };
  $('pwd').onkeydown = function(e){ if(e.key === 'Enter') accedi($('pwd').value, false); };
  $('pwd').focus();
}

function accedi(pwd, silenzioso){
  if($('entra')){ $('entra').disabled = true; $('entra').textContent = 'Verifico…'; }
  else mostra('<div class="scheda"><p class="caricamento">Collegamento al registro…</p></div>');
  chiama('accedi', { pwd: pwd }).then(function(info){
    DOC.pwd = pwd; DOC.info = info;
    try{ sessionStorage.setItem('presenze_pwd', pwd); }catch(e){}
    mostraMenu();
  }).catch(function(e){
    try{ sessionStorage.removeItem('presenze_pwd'); }catch(x){}
    mostraLogin(silenzioso && /Password errata/.test(testoErrore(e)) ? null : testoErrore(e));
  });
}

function aggiornaMenu(){
  return chiama('accedi', { pwd: DOC.pwd }).then(function(i){ DOC.info = i; mostraMenu(); });
}

function mostraMenu(){
  fermaAggiornamento(); DOC.lezione = null; esciSchermoIntero();
  var i = DOC.info;
  var opzioni = i.materie.map(function(m){ return '<option>' + esc(m) + '</option>'; }).join('');
  var aperte = i.aperte.length ?
    '<div class="campo"><select id="sel_aperta">' + i.aperte.map(function(l){
      return '<option value="' + esc(l.id) + '">' + esc(l.materia + (l.argomento ? ' · ' + l.argomento : '') +
        ' — aperta il ' + l.aperta_il.substring(8, 10) + '/' + l.aperta_il.substring(5, 7) + ' ' + l.aperta_il.substring(11, 16)) + '</option>';
    }).join('') + '</select></div><button id="riprendi" type="button" class="btn-sec">Riprendi</button>'
    : '<p class="sotto">Nessuna.</p>';
  mostra('<div class="pannello"><div class="barra"><span>' + esc(i.docente) + '</span>' +
      '<button id="esci" type="button" class="btn-sec">Esci</button></div>' +
    '<div class="griglia"><div class="riquadro"><h3>Nuova lezione</h3>' +
      (i.materie.length ? '<div class="campo"><label for="materia">Materia</label><select id="materia">' + opzioni + '</select></div>'
        : '<div class="avviso grave">Nessuna materia: scrivile nella scheda "Impostazioni" del foglio Google.</div>') +
      '<div class="campo"><label for="argomento">Argomento o n. lezione (facoltativo)</label><input id="argomento" type="text"></div>' +
      '<div class="campo"><label for="durata">Il QR resta valido per (minuti)</label><input id="durata" type="number" min="5" max="600" step="5" value="' + esc(i.durata) + '"></div>' +
      '<button id="avvia" type="button" class="btn-grande"' + (i.materie.length ? '' : ' disabled') + '>Avvia lezione e genera QR</button></div>' +
    '<div class="riquadro"><h3>Lezioni ancora aperte</h3>' + aperte + '</div></div></div>');
  if($('avvia')) $('avvia').onclick = avviaLezione;
  if($('riprendi')) $('riprendi').onclick = function(){ apriLezione($('sel_aperta').value, this); };
  $('esci').onclick = function(){ try{ sessionStorage.removeItem('presenze_pwd'); }catch(e){} DOC.pwd = null; mostraLogin(); };
}

function avviaLezione(){
  var b = $('avvia'); b.disabled = true; b.textContent = 'Avvio…';
  chiama('avvia', { pwd: DOC.pwd, materia: $('materia').value, argomento: $('argomento').value, durata: $('durata').value })
    .then(function(s){ DOC.nTentativi = s.tentativi.length; mostraLezione(s); avviaAggiornamento(); })
    .catch(function(e){ b.disabled = false; b.textContent = 'Avvia lezione e genera QR'; alert(testoErrore(e)); });
}

function apriLezione(id, bottone){
  if(bottone){ bottone.disabled = true; bottone.textContent = 'Apro…'; }
  chiama('stato', { pwd: DOC.pwd, id: id })
    .then(function(s){ DOC.nTentativi = s.tentativi.length; mostraLezione(s); avviaAggiornamento(); })
    .catch(function(e){ if(bottone){ bottone.disabled = false; bottone.textContent = 'Riprendi'; } alert(testoErrore(e)); });
}

function qrSvg(testo){
  var q = qrcode(0, 'M'); q.addData(testo); q.make();
  var n = q.getModuleCount(), b = 4, d = '';
  for(var r = 0; r < n; r++) for(var c = 0; c < n; c++) if(q.isDark(r, c)) d += 'M' + (c + b) + ',' + (r + b) + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (n + 2 * b) + ' ' + (n + 2 * b) + '" shape-rendering="crispEdges" role="img" aria-label="QR code della lezione">' +
    '<rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}

function mostraLezione(s){
  DOC.lezione = s.lezione;
  var l = s.lezione, url = linkStudente(MOTORE, l.id);
  mostra('<div class="pannello"><div class="griglia">' +
    '<div class="riquadro"><div id="box_qr"><div class="titolo-qr">' + esc(l.materia) + '</div>' + qrSvg(url) +
      '<div class="url">' + esc(url) + '</div></div>' +
      '<div style="margin-top:10px"><button id="intero" type="button" class="btn-sec">Schermo intero</button>' +
      (l.codice ? '<button id="mostra_codice" type="button" class="btn-sec">Mostra/nascondi codice</button>' : '') + '</div>' +
      (l.codice ? '<div id="codice" class="codice">' + esc(l.codice) + '</div>' : '') + '</div>' +
    '<div class="riquadro"><div class="testa"><div><div class="sotto" style="margin:0">Presenti</div><span id="contatore" class="contatore">0</span></div>' +
      '<div class="sotto" style="margin:0;text-align:right">' + (l.aperta ? 'Scade alle ' + esc(l.scade_il.substring(11, 16)) : 'Lezione chiusa') + '</div></div><hr>' +
      '<div id="tentativi"></div><div class="scorrimento" id="tabella"></div><hr>' +
      '<button id="indietro" type="button" class="btn-sec">Torna al menu (lezione aperta)</button>' +
      '<button id="scarica" type="button" class="btn-sec">Scarica CSV</button>' +
      '<button id="chiudi" type="button" class="btn-sec pericolo">Chiudi presenze</button>' +
      '<div id="stato_agg" class="nota" style="margin:8px 0 0"></div></div>' +
    '</div></div>');
  $('intero').onclick = schermoIntero;
  $('box_qr').onclick = function(){ if(this.classList.contains('intero')) schermoIntero(); };
  if($('mostra_codice')) $('mostra_codice').onclick = function(){ var c = $('codice'); c.style.display = c.style.display === 'block' ? 'none' : 'block'; };
  $('indietro').onclick = function(){ this.disabled = true; aggiornaMenu().catch(function(e){ alert(testoErrore(e)); }); };
  $('scarica').onclick = scaricaCsv;
  $('chiudi').onclick = function(){
    if(!confirm('Chiudere le presenze? Dopo la chiusura il QR code non funzionerà più per questa lezione.')) return;
    var b = this; b.disabled = true; b.textContent = 'Chiudo…';
    chiama('chiudi', { pwd: DOC.pwd, id: l.id }).then(aggiornaMenu)
      .catch(function(e){ b.disabled = false; b.textContent = 'Chiudi presenze'; alert(testoErrore(e)); });
  };
  aggiornaDati(s);
}

function descriviTentativo(t){
  return t.ora.substring(11, 16) + ' — ' + t.nome + ' ' + t.cognome + ' (' + t.matricola + '): ' +
    (/^telefono/.test(t.motivo) ? 'dal telefono già usato da ' + t.gia_usato_da
      : 'matricola già registrata, nuovo tentativo da un altro telefono (' + t.telefono + ')');
}

function aggiornaDati(s){
  if(!$('contatore')) return;
  DOC.ultimo = s;
  $('contatore').textContent = s.presenze.length;
  var p = s.presenze.slice().reverse();
  $('tabella').innerHTML = p.length ?
    '<table class="presenze"><thead><tr><th>Ora</th><th>Matricola</th><th>Studente</th><th>Telefono</th></tr></thead><tbody>' +
    p.map(function(r){ return '<tr><td>' + esc(r.ora.substring(11, 16)) + '</td><td>' + esc(r.matricola) + '</td><td>' +
      esc(r.cognome + ' ' + r.nome) + '</td><td>' + esc(r.telefono) + '</td></tr>'; }).join('') + '</tbody></table>'
    : '<p class="sotto">In attesa delle prime registrazioni…</p>';
  var t = s.tentativi.slice().reverse();
  $('tentativi').innerHTML = t.length ?
    '<div class="tentativi"><b>&#9940; Tentativi bloccati: ' + t.length + '</b><ul>' +
    t.map(function(x){ return '<li>' + esc(descriviTentativo(x)) + '</li>'; }).join('') + '</ul></div>' : '';
  if(DOC.nTentativi >= 0 && s.tentativi.length > DOC.nTentativi)
    s.tentativi.slice(DOC.nTentativi).forEach(function(x){ avvisoAComparsa(descriviTentativo(x)); });
  DOC.nTentativi = s.tentativi.length;
}

function avvisoAComparsa(testo){
  var t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = '<b>Tentativo bloccato</b>' + esc(testo);
  t.onclick = function(){ t.remove(); };
  $('toasts').appendChild(t);
  setTimeout(function(){ t.remove(); }, 20000);
}

function avviaAggiornamento(){
  fermaAggiornamento();
  var errori = 0;
  DOC.timer = setInterval(function(){
    if(!DOC.lezione || DOC.inCorso) return;
    DOC.inCorso = true;
    chiama('stato', { pwd: DOC.pwd, id: DOC.lezione.id }).then(function(s){
      errori = 0; aggiornaDati(s);
      if($('stato_agg')) $('stato_agg').textContent = '';
    }).catch(function(){
      errori++;
      if(errori >= 3 && $('stato_agg')) $('stato_agg').textContent = 'Aggiornamento in pausa: controllo la connessione…';
    }).then(function(){ DOC.inCorso = false; });
  }, 5000);
}
function fermaAggiornamento(){ if(DOC.timer){ clearInterval(DOC.timer); DOC.timer = null; } }

function scaricaCsv(){
  var s = DOC.ultimo, l = DOC.lezione;
  if(!s || !l) return;
  var cella = function(v){ return '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"'; };
  var righe = [['data_ora', 'materia', 'argomento', 'matricola', 'cognome', 'nome', 'telefono'].map(cella).join(';')];
  s.presenze.forEach(function(p){
    righe.push([p.ora, l.materia, l.argomento, p.matricola, p.cognome, p.nome, p.telefono].map(cella).join(';'));
  });
  var blob = new Blob(['﻿' + righe.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'presenze_' + l.materia.replace(/[^A-Za-z0-9]+/g, '_') + '_' + (s.presenze[0] ? s.presenze[0].ora.substring(0, 10) : 'lezione') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}

function schermoIntero(){
  var b = $('box_qr'); b.classList.toggle('intero');
  document.body.classList.toggle('qr-intero', b.classList.contains('intero'));
  try{
    if(b.classList.contains('intero')){ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){}); }
    else if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen(); }
  }catch(e){}
}
function esciSchermoIntero(){ var b = $('box_qr'); if(b) b.classList.remove('intero'); document.body.classList.remove('qr-intero'); }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') esciSchermoIntero(); });
document.addEventListener('fullscreenchange', function(){ if(!document.fullscreenElement) esciSchermoIntero(); });

/* ============================================================
   Avvio: sceglie la pagina in base all'indirizzo
   ============================================================ */
if(PARAMETRI.has('l')) paginaStudente(PARAMETRI.get('l'));
else if(PARAMETRI.has('docente')) paginaDocente();
else paginaConfigurazione();
</script>
</body>
</html>
